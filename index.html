<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easel → MASSO ATC Job Composer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Easel → MASSO ATC Job Composer</h1>
      <p>Combine single-tool Easel G-code files into one RapidChange-aware MASSO job.</p>
    </header>

    <section class="panel">
      <h2>1. Add Easel G-code files</h2>
      <input id="fileInput" type="file" accept=".nc,.gcode,.txt" multiple>
      <p class="hint">Initial test files are in <code>test-files/</code>. Add them here to build a job.</p>
    </section>

    <section class="panel">
      <h2>2. Job operations</h2>
      <div id="operationList" class="operation-list">
        <p class="empty">No files added yet.</p>
      </div>
    </section>

    <section class="panel">
      <h2>3. Machine settings</h2>
      <div class="settings-grid">
        <label>Park X <input id="parkX" type="number" step="0.001" value="0"></label>
        <label>Park Y <input id="parkY" type="number" step="0.001" value="0"></label>
        <label>Park Z <input id="parkZ" type="number" step="0.001" value="2"></label>
        <label>Tool setter X <input id="setterX" type="number" step="0.001" value="0.315"></label>
        <label>Tool setter Y <input id="setterY" type="number" step="0.001" value="0.273"></label>
      </div>
      <label class="checkbox"><input id="dustShoeEnabled" type="checkbox" checked> Pause for dust-shoe removal/reinstallation</label>
    </section>

    <section class="panel">
      <h2>4. Build</h2>
      <button id="generateButton" disabled>Generate Combined .nc</button>
      <pre id="status" aria-live="polite"></pre>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
